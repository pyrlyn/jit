name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # cancel the run on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: zig version
      - run: zig build fmt-check
      - run: zig build test --summary all
      - run: zig build test-x86-32 --summary all
      - run: zig build test-capi -Dtarget=x86-linux-musl --summary all
      - run: zig build lib -Dx86-features=sse4_2,popcnt,avx2
      - name: Install qemu-user (RISC-V execution tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user
      - run: zig build test-riscv64 -fqemu --summary all
      - run: zig build test-bc2jit e2e-bc2jit -Dtarget=riscv64-linux-musl -fqemu --summary all
      - name: Cancel whole run on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  test:
    name: test (${{ matrix.os }})
    needs: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # cancel the run on failure
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: zig version
      - run: zig build test --summary all
      - name: Cancel whole run on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
